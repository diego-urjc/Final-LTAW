{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-10 mx-auto">
        <div class="card shadow-lg">
            <div class="card-header bg-danger text-white">
                <div class="row align-items-center">
                    <div class="col">
                        <h3 class="mb-0">
                            <i class="bi bi-sword"></i> Combate en Curso
                        </h3>
                    </div>
                    <div class="col-auto">
                        <span class="badge bg-light text-dark fs-6">
                            Turno {{ turn }}
                        </span>
                    </div>
                </div>
            </div>
            <div class="card-body">
                {% include 'battles/_battle_content.html' %}
            </div>
        </div>
    </div>
</div>


<style>
.card {
    border: none;
    border-radius: 15px;
}

.card-header {
    border-radius: 15px 15px 0 0 !important;
}

.btn {
    border-radius: 8px;
    transition: all 0.3s ease;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

.progress {
    border-radius: 10px;
}

/* HP bar baja progresivamente, estilo Pokémon */
.progress-bar.hp-bar {
    transition: width 1.2s cubic-bezier(.4, 0, .2, 1), background-color .8s ease;
}

/* === Escena de combate estilo Pokémon Showdown === */
.battle-scene {
    position: relative;
    width: 100%;
    height: 320px;
    background: linear-gradient(to bottom,
        #87ceeb 0%,
        #b3e0ff 55%,
        #6ab04c 55%,
        #4a8b34 100%);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: inset 0 0 60px rgba(0,0,0,.25);
}

.battle-creature {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.battle-creature img {
    object-fit: contain;
    filter: drop-shadow(0 6px 6px rgba(0,0,0,.35));
    z-index: 2;
}

.battle-platform {
    width: 180px;
    height: 25px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 70%);
    margin-top: -15px;
    border-radius: 50%;
    z-index: 1;
}

/* Rival arriba a la derecha, más pequeño (lejos) */
.battle-enemy {
    top: 20px;
    right: 14%;
}
.battle-enemy img {
    width: 130px;
    height: 130px;
}
.battle-enemy .battle-platform {
    width: 140px;
    height: 20px;
}

/* Jugador abajo a la izquierda, más grande (cerca), espejado */
.battle-player {
    bottom: 20px;
    left: 14%;
}
.battle-player img {
    width: 200px;
    height: 200px;
    transform: scaleX(-1);
}
.battle-player .battle-platform {
    width: 220px;
}

/* Roster lateral de mini-cards */
.team-roster {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 3;
}
.team-roster-left { left: 6px; }
.team-roster-right { right: 6px; }

.mini-card {
    width: 44px;
    height: 44px;
    background: rgba(255,255,255,.85);
    border: 2px solid #6c757d;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 2px 4px rgba(0,0,0,.2);
}
.mini-card img {
    width: 36px;
    height: 36px;
    object-fit: contain;
}
.mini-card.active {
    border-color: #ffcb05;
    box-shadow: 0 0 8px #ffcb05;
}
.mini-card.fainted {
    opacity: .4;
    filter: grayscale(1);
}
.mini-card .mini-x {
    position: absolute;
    color: #dc3545;
    font-size: 1.5rem;
    font-weight: bold;
}

@media (max-width: 576px) {
    .battle-scene { height: 220px; }
    .battle-enemy img { width: 90px; height: 90px; }
    .battle-player img { width: 130px; height: 130px; }
    .mini-card { width: 32px; height: 32px; }
    .mini-card img { width: 26px; height: 26px; }
}
</style>
{% endblock %}
